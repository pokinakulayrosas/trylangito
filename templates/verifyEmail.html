<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='./styles/verifyEmail.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='admin/logo.png') }}" type="x-icon">

    <style>
        *{
            margin: 0;
            font-family: Arial;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f6f6f9;
            transition: 0.5s;
        }

        .login {
        max-width: 320px;
        padding: 1rem;
        background-color: #fff;
        border-radius: 10px;
        box-shadow: 20px 20px 30px rgba(0, 0, 0, .05);
        }

        .title {
        font-weight: 600;
        color: rgb(31 41 55);
        }

        .description {
        margin-top: 1rem;
        font-size: 0.875rem;
        line-height: 1.25rem;
        color: rgb(75 85 99);
        }

        .description a {
        --tw-text-opacity: 1;
        color: rgb(59 130 246);
        }

        .description a:hover {
        -webkit-text-decoration-line: underline;
        text-decoration-line: underline;
        }

        .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 1rem;
        -moz-column-gap: 1rem;
        column-gap: 1rem;
        flex-shrink: 0;
        }

        .pref {
        font-size: 0.75rem;
        line-height: 1rem;
        color: rgb(31 41 55 );
        -webkit-text-decoration-line: underline;
        text-decoration-line: underline;
        transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
        border: none;
        background-color: transparent;
        }

        .pref:hover {
        color: rgb(156 163 175);
        }

        .pref:focus {
        outline: 2px solid transparent;
        outline-offset: 2px;
        }

        .accept {
        font-size: 0.75rem;
        line-height: 1rem;
        background-color: rgb(17 24 39);
        font-weight: 500;
        border-radius: 0.5rem;
        color: #fff;
        padding-left: 1rem;
        padding-right: 1rem;
        padding-top: 0.625rem;
        padding-bottom: 0.625rem;
        border: none;
        transition: all .15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .accept:hover {
        background-color: rgb(55 65 81);
        }

        .accept:focus {
        outline: 2px solid transparent;
        outline-offset: 2px;
        }
    </style>

</head>
<body>
    <div class="login">
        <form name="verify_email">
            <span class="title">✉ Email Verification</span>
            <p class="description">Please check your email for a verification link.</p>
            <p class="description">Email: <a href="#">{{ email }}</a></p>
            <div class="actions">
                <button class="accept">
                    Back to login
                </button>
            </div>
        </form>
    </div>


    <script>
        let btn = document.getElementById('btn');
        let txt = document.getElementById('txt');
        function changeColor(color){
            document.body.style.background = color;
            btn.style.background = color;
            txt.style.borderColor = color;
       
            document.querySelectorAll('span').forEach(function(item){
                item.classList.remove('active');
            })
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
